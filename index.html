<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光スタ</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { --primary: #4A90E2; --bg: #F5F7FA; --text: #333; --card-bg: #FFF; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); }
    .hidden { display: none !important; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 5px 0; width: 100%; }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: #6c757d; }
    
    /* タブ */
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
    .tab { flex: 1; padding: 10px; cursor: pointer; color: #888; font-size: 0.9rem; }
    .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }
    
    /* 入力フォーム */
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.8rem; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: var(--card-bg); }
    
    /* フラッシュカード */
    .flashcard { border: 1px solid #ddd; border-radius: 8px; padding: 40px 20px; margin: 20px 0; font-size: 1.5rem; min-height: 150px; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative;}
    .answer-text { color: var(--primary); font-weight: bold; margin-top: 20px; border-top: 1px dashed #ddd; padding-top: 20px; width: 100%; }
    
    /* タイマー */
    .timer-display { font-size: 3.5rem; font-weight: bold; margin: 20px 0; font-family: monospace; }
    .eval-buttons { display: flex; gap: 8px; margin-top: 10px; }
    .eval-buttons button { flex: 1; padding: 15px 5px; font-size: 1rem; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
    .eval-buttons button:active { opacity: 0.8; }
    
    /* カード一覧 */
    .card-item { background: var(--bg); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; text-align: left; }
    .card-info { font-size: 0.85rem; color: var(--text); line-height: 1.5; flex: 1; padding-right: 10px; }
    .btn-delete { background: #E24A4A; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; width: auto; }
    .btn-delete:active { opacity: 0.8; }
    
    #status { font-size: 0.8rem; color: #666; margin-bottom: 15px; height: 1.2rem; }

    /* 教科選択セクション */
    .subject-box { text-align: left; margin-bottom: 20px; padding: 12px; background: var(--bg); border-radius: 8px; border: 1px solid #eee; }
    .subject-box label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.8rem; color: #555; }
    .subject-flex { display: flex; gap: 8px; margin-top: 5px; }
    .btn-add-subject { background: #34d399; color: white; border: none; padding: 0 15px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-add-subject:active { opacity: 0.8; }
  </style>
</head>
<body>

<div class="container">
  <h1>光スタ</h1>
  <div id="status">ログインしてください</div>
  
  <div id="loginSection">
    <button id="loginBtn" class="btn">Googleでログイン</button>
  </div>

  <div id="appSection" class="hidden">
    <div id="subjectSection" class="subject-box hidden">
      <label>現在の教科（シート）</label>
      <div class="subject-flex">
        <select id="subjectSelect" onchange="changeSubject()"></select>
        <button onclick="createSubject()" class="btn-add-subject">新教科を追加</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('anki')">暗記</div>
      <div class="tab" onclick="switchTab('add')">追加</div>
      <div class="tab" onclick="switchTab('list')">一覧</div>
      <div class="tab" onclick="switchTab('timer')">記録</div>
      <div class="tab" onclick="switchTab('settings')">設定</div>
    </div>

    <div id="ankiTab">
      <div id="cardStats" style="font-size: 0.8rem; color:#666;"></div>
      <div class="flashcard">
        <div id="questionArea">カードを読み込んでいます...</div>
        <div id="answerArea" class="answer-text hidden"></div>
      </div>
      <button id="showAnswerBtn" class="btn hidden">答えを見る</button>
      
      <div id="evaluationArea" class="eval-buttons hidden">
        <button onclick="evaluateCard(false)" style="background:#E24A4A;">わからなかった</button>
        <button onclick="evaluateCard(true)" style="background:#4A90E2;">わかった</button>
      </div>
    </div>

    <div id="addTab" class="hidden">
      <div class="form-group">
        <label>問題（表面）</label>
        <input type="text" id="newQuestion" placeholder="例: Apple">
      </div>
      <div class="form-group">
        <label>答え（裏面）</label>
        <textarea id="newAnswer" rows="3" placeholder="例: りんご"></textarea>
      </div>
      <button onclick="addNewCard()" class="btn">スプレッドシートに保存</button>
    </div>

    <div id="listTab" class="hidden">
      <div id="cardList" style="margin-top: 10px; max-height: 400px; overflow-y: auto;"></div>
    </div>

    <div id="timerTab" class="hidden">
      <div class="timer-display" id="timeDisplay">00:00:00</div>
      <button id="startTimerBtn" class="btn" style="background:#4AE27C;">学習開始</button>
      <button id="stopTimerBtn" class="btn hidden" style="background:#E24A4A;">終了・記録を保存</button>
    </div>

    <div id="settingsTab" class="hidden">
      <div class="form-group">
        <label>保存先スプレッドシートID</label>
        <input type="text" id="sheetIdInput" placeholder="例: 1j_yPSiztoIr0cIr8ASPxNw...">
      </div>
      <button onclick="saveSheetId()" class="btn" style="background:#F5A623;">IDを保存する</button>
      <p style="font-size: 0.75rem; color: #888; margin-top: 15px; text-align: left;">
        ※ご自身のGoogleドライブにコピーしたスプレッドシートのIDを入力してください。<br>
        ※一度保存すると、このブラウザに記憶されます。
      </p>
    </div>

  </div>
</div>

<script>
  // ==========================================
  // 設定
  // ==========================================
  const CLIENT_ID = '973807059867-6f1lvggt9jm3b9a7u6um5rd87j4rsbdv.apps.googleusercontent.com';
  
  let SPREADSHEET_ID = localStorage.getItem('studySyncSheetId') || '';
  
  let accessToken = '';
  let tokenClient;
  let cardsData = [];
  let currentCardIndex = -1;
  let reviewQueue = [];
  let secondsElapsed = 0;
  let timerInterval;

  // 動的教科管理用変数
  let currentSubject = 'Cards';
  let subjectsList = [];

  // 初期化
  window.onload = function () {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/spreadsheets',
      callback: async (tokenResponse) => {
        if (tokenResponse.access_token) {
          accessToken = tokenResponse.access_token;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('appSection').classList.remove('hidden');
          
          document.getElementById('sheetIdInput').value = SPREADSHEET_ID;

          if (SPREADSHEET_ID) {
            await fetchSubjects(); // 最初に教科一覧を取得
            fetchCards();
          } else {
            switchTab('settings');
            updateStatus('最初にスプレッドシートIDを登録してください');
          }
        }
      },
    });
    document.getElementById('loginBtn').onclick = () => tokenClient.requestAccessToken();
  };

  // 教科（シート名）一覧を取得する関数
  async function fetchSubjects() {
    if (!checkSheetIdIsSet()) return;
    try {
      const resp = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?fields=sheets.properties.title`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await resp.json();
      if (data.sheets) {
        // Logsシート以外のシート名を教科リストとして抽出
        subjectsList = data.sheets
          .map(s => s.properties.title)
          .filter(title => title !== 'Logs');
        
        const select = document.getElementById('subjectSelect');
        select.innerHTML = '';
        subjectsList.forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.innerText = sub;
          if (sub === currentSubject) opt.selected = true;
          select.appendChild(opt);
        });
        
        if (!subjectsList.includes(currentSubject) && subjectsList.length > 0) {
          currentSubject = subjectsList[0];
          select.value = currentSubject;
        }
        
        document.getElementById('subjectSection').classList.remove('hidden');
      }
    } catch (e) {
      console.error('教科一覧の取得に失敗しました', e);
    }
  }

  // 教科プルダウン変更時の処理
  async function changeSubject() {
    currentSubject = document.getElementById('subjectSelect').value;
    await fetchCards();
    if (!document.getElementById('listTab').classList.contains('hidden')) {
      renderCardList();
    }
  }

  // アプリ内からスプレッドシートに新しいシートを作成する関数
  async function createSubject() {
    if (!checkSheetIdIsSet()) return;
    
    const name = prompt('新しい教科名を入力してください:');
    if (!name || !name.trim()) return;
    const subjectName = name.trim();

    if (subjectsList.includes(subjectName) || subjectName === 'Logs') {
      alert('すでに存在する教科名か、使用できない名前です。');
      return;
    }

    updateStatus('新しい教科シートを作成中...');
    try {
      // 1. 新しいシートを追加するリクエスト
      const createResp = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}:batchUpdate`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          requests: [{
            addSheet: {
              properties: { title: subjectName }
            }
          }]
        })
      });

      if (!createResp.ok) throw new Error('シートの作成に失敗しました');

      // 2. 作成したシートの1行目に必要な見出し（ヘッダー）を書き込む
      const headerValues = [['id', 'question', 'answer', 'ef', 'interval', 'repetitions', 'nextReview']];
      const headerResp = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(subjectName)}!A1:G1?valueInputOption=USER_ENTERED`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ values: headerValues })
      });

      if (headerResp.ok) {
        updateStatus('教科を追加しました！');
        currentSubject = subjectName; // 新しい教科を現在の選択にする
        await fetchSubjects();       // プルダウンを更新
        await fetchCards();          // 空のデータを読み込んで暗記画面をリセット
      }
    } catch (e) {
      alert('教科の追加に失敗しました。');
      updateStatus('同期エラー');
    }
  }

  function saveSheetId() {
    const inputId = document.getElementById('sheetIdInput').value.trim();
    if (!inputId) {
      alert('スプレッドシートIDを入力してください。');
      return;
    }
    localStorage.setItem('studySyncSheetId', inputId);
    SPREADSHEET_ID = inputId;
    alert('スプレッドシートIDを保存しました！');
    fetchSubjects();
    switchTab('anki');
  }

  function checkSheetIdIsSet() {
    if (!SPREADSHEET_ID) {
      alert('スプレッドシートIDが設定されていません。「設定」タブから登録してください。');
      switchTab('settings');
      return false;
    }
    return true;
  }

  async function fetchCards() {
    if (!checkSheetIdIsSet()) return;

    updateStatus('シートから読み込み中...');
    try {
      const resp = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(currentSubject)}!A2:G`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await resp.json();
      
      if (data.error) {
        updateStatus('エラー: IDが間違っているか権限がありません');
        return;
      }
      
      if (data.values) {
        cardsData = data.values.map((row, idx) => ({
          rowIndex: idx + 2,
          id: row[0], question: row[1], answer: row[2],
          ef: parseFloat(row[3]) || 2.5,
          interval: parseInt(row[4]) || 0,
          repetitions: parseInt(row[5]) || 0,
          nextReview: parseInt(row[6]) || 0
        }));
        buildReviewQueue();
        updateStatus('同期完了');
      } else {
        cardsData = [];
        document.getElementById('questionArea').innerText = 'カードがありません。「追加」タブから作成してください。';
        updateStatus('データなし');
      }
    } catch (e) {
      updateStatus('読み込みエラー');
    }
  }

  async function addNewCard() {
    if (!checkSheetIdIsSet()) return;

    const q = document.getElementById('newQuestion').value.trim();
    const a = document.getElementById('newAnswer').value.trim();

    if (!q || !a) {
      alert('問題と答えの両方を入力してください。');
      return;
    }

    updateStatus('スプレッドシートに保存中...');
    
    const newId = cardsData.length + 1;
    const newRow = [newId, q, a, 2.5, 0, 0, 0]; 

    try {
      const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(currentSubject)}!A:G:append?valueInputOption=USER_ENTERED`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ values: [newRow] })
      });

      if (response.ok) {
        document.getElementById('newQuestion').value = '';
        document.getElementById('newAnswer').value = '';
        updateStatus('カードを追加しました！');
        await fetchCards();
        setTimeout(() => switchTab('anki'), 1000);
      }
    } catch (e) {
      updateStatus('保存失敗');
    }
  }

  async function updateCardRow(card) {
    if (!checkSheetIdIsSet()) return;

    const range = `${encodeURIComponent(currentSubject)}!A${card.rowIndex}:G${card.rowIndex}`;
    const values = [[card.id, card.question, card.answer, card.ef, card.interval, card.repetitions, card.nextReview]];
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}?valueInputOption=USER_ENTERED`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ values })
    });
  }

  function buildReviewQueue() {
    const now = Date.now();
    reviewQueue = cardsData
      .map((c, i) => ({...c, originalIndex: i}))
      .filter(c => c.nextReview <= now)
      .map(c => c.originalIndex)
      .sort(() => Math.random() - 0.5);
    
    updateCardStats();
    showNextCard();
  }

  function showNextCard() {
    document.getElementById('answerArea').classList.add('hidden');
    document.getElementById('evaluationArea').classList.add('hidden');
    
    if (reviewQueue.length === 0) {
      document.getElementById('questionArea').innerText = '本日の復習は完了です！お疲れ様でした✨';
      document.getElementById('showAnswerBtn').classList.add('hidden');
      return;
    }
    
    currentCardIndex = reviewQueue[0];
    document.getElementById('questionArea').innerText = cardsData[currentCardIndex].question;
    document.getElementById('answerArea').innerText = cardsData[currentCardIndex].answer;
    document.getElementById('showAnswerBtn').classList.remove('hidden');
  }

  document.getElementById('showAnswerBtn').onclick = () => {
    document.getElementById('answerArea').classList.remove('hidden');
    document.getElementById('showAnswerBtn').classList.add('hidden');
    document.getElementById('evaluationArea').classList.remove('hidden');
  };

  async function evaluateCard(isUnderstood) {
    updateStatus('記録中...');
    let card = cardsData[currentCardIndex];
    let { ef, interval, repetitions } = card;

    if (isUnderstood) {
      if (repetitions === 0) interval = 1;        
      else if (repetitions === 1) interval = 6;   
      else interval = Math.round(interval * ef);  
      
      repetitions++;
      ef = Math.max(1.3, ef + 0.1); 
      
      card.ef = ef;
      card.interval = interval;
      card.repetitions = repetitions;
      card.nextReview = Date.now() + interval * 24 * 60 * 60 * 1000; 

      await updateCardRow(card);
      reviewQueue.shift(); 
      
    } else {
      repetitions = 0;
      interval = 1;
      ef = Math.max(1.3, ef - 0.2); 
      
      card.ef = ef;
      card.interval = interval;
      card.repetitions = repetitions;
      card.nextReview = Date.now() + interval * 24 * 60 * 60 * 1000;

      await updateCardRow(card);
      reviewQueue.shift();
      reviewQueue.push(currentCardIndex);
    }

    updateCardStats();
    showNextCard();
    updateStatus('同期完了');
  }

  function renderCardList() {
    const listArea = document.getElementById('cardList');
    listArea.innerHTML = '';

    if (cardsData.length === 0) {
      listArea.innerHTML = '<p style="color: #888; font-size: 0.9rem; padding: 20px;">カードが登録されていません。</p>';
      return;
    }

    cardsData.forEach((card, index) => {
      const item = document.createElement('div');
      item.className = 'card-item';
      item.innerHTML = `
        <div class="card-info">
          <strong>ID: ${card.id}</strong><br>
          【問】${card.question}<br>
          【答】${card.answer}
        </div>
        <button class="btn-delete" onclick="deleteCard(${index})">削除</button>
      `;
      listArea.appendChild(item);
    });
  }

  async function deleteCard(index) {
    if (!confirm('この問題を削除しますか？\n削除すると、以降の問題のID番号は自動的に1つずつ前に詰められます。')) return;
    if (!checkSheetIdIsSet()) return;

    updateStatus('カードを削除中...');
    
    cardsData.splice(index, 1);
    
    cardsData.forEach((card, idx) => {
      card.id = idx + 1;
    });

    try {
      await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(currentSubject)}!A2:G:clear`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });

      if (cardsData.length > 0) {
        const values = cardsData.map(c => [c.id, c.question, c.answer, c.ef, c.interval, c.repetitions, c.nextReview]);
        const range = `${encodeURIComponent(currentSubject)}!A2:G${cardsData.length + 1}`;
        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}?valueInputOption=USER_ENTERED`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ values })
        });
      }

      updateStatus('削除が完了しました');
      await fetchCards();
      renderCardList();
    } catch (e) {
      updateStatus('削除失敗');
    }
  }

  // 学習記録
  document.getElementById('startTimerBtn').onclick = () => {
    document.getElementById('startTimerBtn').classList.add('hidden');
    document.getElementById('stopTimerBtn').classList.remove('hidden');
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const h = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
      const m = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timeDisplay').innerText = `${h}:${m}:${s}`;
    }, 1000);
  };

  document.getElementById('stopTimerBtn').onclick = async () => {
    if (!checkSheetIdIsSet()) return;

    clearInterval(timerInterval);
    updateStatus('記録を保存中...');
    const now = new Date().toLocaleString();
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/Logs!A:B:append?valueInputOption=USER_ENTERED`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[now, secondsElapsed]] })
    });
    secondsElapsed = 0;
    document.getElementById('timeDisplay').innerText = '00:00:00';
    document.getElementById('stopTimerBtn').classList.add('hidden');
    document.getElementById('startTimerBtn').classList.remove('hidden');
    updateStatus('記録を保存しました');
  };

  // 共通UI管理
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    ['anki', 'add', 'list', 'timer', 'settings'].forEach(t => document.getElementById(t + 'Tab').classList.add('hidden'));
    
    document.getElementById(tab + 'Tab').classList.remove('hidden');
    
    const activeTabEl = document.querySelector(`.tab[onclick="switchTab('${tab}')"]`);
    if(activeTabEl) activeTabEl.classList.add('active');
    
    if (tab === 'anki' && SPREADSHEET_ID) fetchCards();
    if (tab === 'list') renderCardList(); 
  }

  function updateStatus(msg) { document.getElementById('status').innerText = msg; }
  function updateCardStats() { document.getElementById('cardStats').innerText = `残り復習カード: ${reviewQueue.length}枚`; }
</script>

</body>
</html>
